# ALSA dsnoop configuration — allows multiple processes to share the
# line-in capture device simultaneously (e.g. song tracker + live stream).
#
# Deploy to: /etc/asound.conf on the Pi
# Verify card number first: arecord -l  (look for the C-Media / TROND device)

pcm.dsnoop_trond {
    type dsnoop
    ipc_key 2468
    slave {
        pcm "hw:1,0"
        rate 44100
        format S16_LE
        channels 2        # hardware captures stereo; plug layer below converts to mono
    }
}

# Plug layer — lets consumers request mono (-c 1 / -ac 1) over the shared stream
pcm.line_in {
    type plug
    slave.pcm "dsnoop_trond"
}
